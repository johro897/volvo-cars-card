<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>volvo-cars-card test</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; padding: 16px; }
  #results { margin-bottom: 24px; }
  .pass { color: #4caf50; }
  .fail { color: #ef5350; font-weight: bold; }
  #summary { font-size: 18px; font-weight: bold; margin-bottom: 12px; padding: 8px 12px; border-radius: 6px; }
  #stage { border: 1px solid #333; padding: 16px; background: #1a1a1a; }
  volvo-cars-card, volvo-cars-card-editor { display: block; margin-bottom: 16px; }
  /* Minimal HA CSS variable stand-ins so the card isn't unstyled */
  :root {
    --primary-text-color: #e1e1e1;
    --secondary-text-color: #9a9a9a;
    --card-background-color: #1c1c1c;
    --secondary-background-color: #262626;
    --divider-color: #333;
    --success-color: #43a047;
    --error-color: #db4437;
    --warning-color: #ff9800;
    --info-color: #03a9f4;
    --primary-color: #03a9f4;
    --ha-card-border-radius: 12px;
    --ha-card-box-shadow: none;
    --ha-card-background: var(--card-background-color);
  }
</style>
</head>
<body>
<h1>volvo-cars-card — scripted smoke test</h1>
<div id="summary">Running…</div>
<ul id="results"></ul>
<div id="stage"></div>

<script src="../volvo-cars-card.js"></script>
<script>
(async () => {
const results = [];
function assert(desc, cond) {
  results.push({ desc, pass: !!cond });
  if (!cond) console.error("FAIL:", desc);
}

function state(id, value, attrs) {
  return { entity_id: id, state: value, attributes: attrs || {} };
}

// --- Mock hass -------------------------------------------------------
const serviceCalls = [];

const entities = {
  // XC60 (EV) — device dev_xc60
  "sensor.xc60_battery": { device_id: "dev_xc60", platform: "volvo" }, // no translation_key: battery exception
  "sensor.xc60_range_battery": { device_id: "dev_xc60", translation_key: "distance_to_empty_battery" },
  // Only the "_charge" variant exists here (not the base "average_energy_consumption")
  // — reproduces the owner's real report: their car only exposes one of the
  // three energy-consumption variants, and the card must fall back to it.
  "sensor.xc60_avg_energy": { device_id: "dev_xc60", translation_key: "average_energy_consumption_charge" },
  "sensor.xc60_charging_status": { device_id: "dev_xc60", translation_key: "charging_status" },
  "sensor.xc60_charging_power": { device_id: "dev_xc60", translation_key: "charging_power" },
  "sensor.xc60_charging_time": { device_id: "dev_xc60", translation_key: "estimated_charging_time" },
  "sensor.xc60_charging_target": { device_id: "dev_xc60", translation_key: "target_battery_charge_level" },
  "sensor.xc60_odometer": { device_id: "dev_xc60", translation_key: "odometer" },
  "sensor.xc60_charging_connection": { device_id: "dev_xc60", translation_key: "charger_connection_status" },
  "sensor.xc60_charging_type": { device_id: "dev_xc60", translation_key: "charging_type" },
  "sensor.xc60_charging_current_limit": { device_id: "dev_xc60", translation_key: "charging_current_limit" },
  "sensor.xc60_trip_manual": { device_id: "dev_xc60", translation_key: "trip_meter_manual" },
  "sensor.xc60_trip_speed_manual": { device_id: "dev_xc60", translation_key: "average_speed" },
  "binary_sensor.xc60_tire_fl": { device_id: "dev_xc60", translation_key: "tire_front_left" },
  "lock.xc60_lock": { device_id: "dev_xc60" },
  "device_tracker.xc60_location": { device_id: "dev_xc60" },
  "binary_sensor.xc60_door_fl": { device_id: "dev_xc60", translation_key: "door_front_left" },
  "binary_sensor.xc60_window_fl": { device_id: "dev_xc60", translation_key: "window_front_left" },
  "button.xc60_clim_start": { device_id: "dev_xc60", translation_key: "climatization_start" },
  "button.xc60_clim_stop": { device_id: "dev_xc60", translation_key: "climatization_stop" },
  "button.xc60_honk": { device_id: "dev_xc60", translation_key: "honk" },
  "button.xc60_flash": { device_id: "dev_xc60", translation_key: "flash" },
  "button.xc60_honk_flash": { device_id: "dev_xc60", translation_key: "honk_flash" },

  // V60 (ICE) — device dev_v60, no charging entities at all
  "sensor.v60_fuel": { device_id: "dev_v60", translation_key: "fuel_amount" },
  "sensor.v60_range_tank": { device_id: "dev_v60", translation_key: "distance_to_empty_tank" },
  // Only the "_automatic" variant exists here (not the base "average_fuel_consumption")
  "sensor.v60_avg_fuel": { device_id: "dev_v60", translation_key: "average_fuel_consumption_automatic" },
  "sensor.v60_distance_to_service": { device_id: "dev_v60", translation_key: "distance_to_service" },
  "sensor.v60_time_to_service": { device_id: "dev_v60", translation_key: "time_to_service" },
  "lock.v60_lock": { device_id: "dev_v60" },
  "device_tracker.v60_location": { device_id: "dev_v60" },
  "binary_sensor.v60_door_fl": { device_id: "dev_v60", translation_key: "door_front_left" },
  "binary_sensor.v60_tank_lid": { device_id: "dev_v60", translation_key: "tank_lid" },
  "button.v60_engine_start": { device_id: "dev_v60", translation_key: "engine_start" },
  "button.v60_engine_stop": { device_id: "dev_v60", translation_key: "engine_stop" },
};

const states = {
  "sensor.xc60_battery": state("sensor.xc60_battery", "78", { device_class: "battery", unit_of_measurement: "%" }),
  "sensor.xc60_range_battery": state("sensor.xc60_range_battery", "410", { unit_of_measurement: "km" }),
  "sensor.xc60_avg_energy": state("sensor.xc60_avg_energy", "18.4", { unit_of_measurement: "kWh/100km" }),
  "sensor.xc60_charging_status": state("sensor.xc60_charging_status", "CHARGING"),
  "sensor.xc60_charging_power": state("sensor.xc60_charging_power", "7.4", { unit_of_measurement: "kW" }),
  "sensor.xc60_charging_time": state("sensor.xc60_charging_time", "100", { unit_of_measurement: "min" }),
  "sensor.xc60_charging_target": state("sensor.xc60_charging_target", "90"),
  "sensor.xc60_odometer": state("sensor.xc60_odometer", "18420", { unit_of_measurement: "km" }),
  "sensor.xc60_charging_connection": state("sensor.xc60_charging_connection", "CONNECTED"),
  "sensor.xc60_charging_type": state("sensor.xc60_charging_type", "AC"),
  "sensor.xc60_charging_current_limit": state("sensor.xc60_charging_current_limit", "16", { unit_of_measurement: "A" }),
  "sensor.xc60_trip_manual": state("sensor.xc60_trip_manual", "142.5", { unit_of_measurement: "km" }),
  "sensor.xc60_trip_speed_manual": state("sensor.xc60_trip_speed_manual", "38.2", { unit_of_measurement: "km/h" }),
  "binary_sensor.xc60_tire_fl": state("binary_sensor.xc60_tire_fl", "on"),
  "lock.xc60_lock": state("lock.xc60_lock", "locked"),
  "device_tracker.xc60_location": state("device_tracker.xc60_location", "home", { latitude: 59.33, longitude: 18.06 }),
  "binary_sensor.xc60_door_fl": state("binary_sensor.xc60_door_fl", "off"),
  "binary_sensor.xc60_window_fl": state("binary_sensor.xc60_window_fl", "on"),
  "button.xc60_clim_start": state("button.xc60_clim_start", "unknown"),
  "button.xc60_clim_stop": state("button.xc60_clim_stop", "unknown"),
  "button.xc60_honk": state("button.xc60_honk", "unknown"),
  "button.xc60_flash": state("button.xc60_flash", "unknown"),
  "button.xc60_honk_flash": state("button.xc60_honk_flash", "unknown"),

  "sensor.v60_fuel": state("sensor.v60_fuel", "42", { unit_of_measurement: "L" }),
  "sensor.v60_range_tank": state("sensor.v60_range_tank", "560", { unit_of_measurement: "km" }),
  "sensor.v60_avg_fuel": state("sensor.v60_avg_fuel", "6.2", { unit_of_measurement: "L/100km" }),
  "sensor.v60_distance_to_service": state("sensor.v60_distance_to_service", "1200", { unit_of_measurement: "km" }),
  "sensor.v60_time_to_service": state("sensor.v60_time_to_service", "90", { unit_of_measurement: "days" }),
  "lock.v60_lock": state("lock.v60_lock", "unlocked"),
  "device_tracker.v60_location": state("device_tracker.v60_location", "not_home", { latitude: 59.1, longitude: 18.5 }),
  "binary_sensor.v60_door_fl": state("binary_sensor.v60_door_fl", "off"),
  "binary_sensor.v60_tank_lid": state("binary_sensor.v60_tank_lid", "on"),
  "button.v60_engine_start": state("button.v60_engine_start", "unknown"),
  "button.v60_engine_stop": state("button.v60_engine_stop", "unknown"),
};

const devices = {
  dev_xc60: { id: "dev_xc60", name: "XC60", name_by_user: null, manufacturer: "Volvo" },
  dev_v60: { id: "dev_v60", name: "V60", name_by_user: null, manufacturer: "Volvo" },
  dev_other: { id: "dev_other", name: "Some Router", name_by_user: null, manufacturer: "Ubiquiti" },
};

const hass = {
  states,
  entities,
  devices,
  language: "en",
  locale: { language: "en" },
  callApi: () => Promise.resolve([[]]), // no history in this test — exercises the "no data" sparkline path
  callWS: () => Promise.resolve({}), // default: no statistics data (a real hass always has callWS — this mirrors that)
  callService: (domain, service, data) => {
    serviceCalls.push({ domain, service, data });
    return Promise.resolve();
  },
};

const stage = document.getElementById("stage");

// --- Card render test --------------------------------------------------
const card = document.createElement("volvo-cars-card");
stage.appendChild(card);
card.setConfig({
  vehicles: [
    { device_id: "dev_xc60", name: "XC60", icon: "mdi:car-electric", picture: "/local/xc60.jpg" },
    { device_id: "dev_v60", name: "V60" },
  ],
  show_stats: true,
});
card.hass = hass;

const vehicles = card.shadowRoot.querySelectorAll(".vc-vehicle");
assert("card renders without throwing", !!card.shadowRoot.querySelector(".vc-card"));
assert("renders two vehicle sections", vehicles.length === 2);
assert("XC60 shows battery ring percentage", vehicles[0].innerHTML.includes("78%"));
assert("XC60 shows open window in doors list", vehicles[0].innerHTML.includes("open"));
assert("XC60 has a charging section (battery+charging sensors present)", !!vehicles[0].querySelector(".vc-charging"));
assert("V60 has NO charging section at all (no charging sensors found)", !vehicles[1].querySelector(".vc-charging"));
assert("V60 shows fuel range, not a percentage ring", vehicles[1].innerHTML.includes("560 km") && vehicles[1].innerHTML.includes("42 L"));
assert("XC60 position link resolves to 'Home'", vehicles[0].innerHTML.includes("Home"));
assert("configured vehicle icon is rendered (regression: the icon field used to be accepted but never shown)", vehicles[0].innerHTML.includes('ha-icon icon="mdi:car-electric"'));
assert("configured vehicle picture is rendered", vehicles[0].querySelector('img.vc-picture[src="/local/xc60.jpg"]') !== null);
assert("V60 (no picture configured) has no vc-picture element", !vehicles[1].querySelector("img.vc-picture"));

// --- Richer charging fields + target-level ring marker ---
assert("charging section shows connection status", vehicles[0].innerHTML.includes("CONNECTED"));
assert("charging section shows charging type", vehicles[0].innerHTML.includes(">AC<"));
assert("charging section shows current limit", vehicles[0].innerHTML.includes("16 A"));
assert("battery ring draws a target-level marker line", !!vehicles[0].querySelector(".vc-ring-wrap line"));

// --- Trip data section (collapsed by default, expands on tap) ---
const tripToggle = Array.from(vehicles[0].querySelectorAll('[data-action="toggle-section"]'))
  .find((el) => el.dataset.section === "trip");
assert("XC60 has a Trip data section (trip meter + average speed present)", !!tripToggle);
assert("trip detail is not shown while collapsed", !vehicles[0].innerHTML.includes("142.5"));
tripToggle.dispatchEvent(new MouseEvent("click", { bubbles: true }));
// That click replaced the whole shadow DOM, so every subsequent lookup
// re-queries fresh from here on rather than reusing the original (now
// detached) `vehicles` reference — a detached node can still be read
// safely (its static content is unaffected), but clicking one is a no-op
// since it's no longer wired to the live shadowRoot's event listener.
let vXc60Trip = card.shadowRoot.querySelectorAll(".vc-vehicle")[0];
let vV60Trip = card.shadowRoot.querySelectorAll(".vc-vehicle")[1];
assert("expanding trip data reveals the trip distance", vXc60Trip.innerHTML.includes("142.5"));
assert("expanding trip data reveals the average speed", vXc60Trip.innerHTML.includes("38.2"));
assert("V60 has NO trip data section (no trip_meter/average_speed sensors)", !Array.from(vV60Trip.querySelectorAll('[data-action="toggle-section"]')).some((el) => el.dataset.section === "trip"));

// --- Stats fallback test: only a non-base energy/fuel variant exists ---
// This reproduces the owner's real report: their EV's average_energy_consumption
// (base) sensor doesn't exist, only one of the other two variants does.
assert("XC60 stats section renders using the '_charge' energy variant (not the missing base key)", vXc60Trip.innerHTML.includes("18.4"));
assert("V60 stats section renders using the '_automatic' fuel variant (not the missing base key)", vV60Trip.innerHTML.includes("6.2"));

// --- Extended door diagram: tank_lid (new zone) shows up in the open list ---
assert("V60's open tank_lid appears in the doors list (extended diagram zone)", vV60Trip.innerHTML.includes("Fuel/charge flap"));

// --- Service & health section ---
const findToggle = (root, section) => Array.from(root.querySelectorAll('[data-action="toggle-section"]')).find((el) => el.dataset.section === section);
const xc60Toggle = findToggle(vXc60Trip, "service");
assert("XC60 has a Service & health section (odometer + an active tire warning present)", !!xc60Toggle);
assert("collapsed summary shows an issue count (one active tire warning)", xc60Toggle.innerHTML.includes("1 issue"));
assert("detail rows are NOT shown while collapsed", !vXc60Trip.querySelector(".vc-warning-row"));
xc60Toggle.dispatchEvent(new MouseEvent("click", { bubbles: true }));
let vXc60Service = card.shadowRoot.querySelectorAll(".vc-vehicle")[0];
assert("expanding reveals the odometer reading", vXc60Service.innerHTML.includes("18420"));
assert("expanding reveals the active tire warning", vXc60Service.innerHTML.includes("Front left tire pressure"));

// The xc60Toggle click above replaced the whole shadow DOM, so re-query
// V60 fresh too rather than reusing the (now detached) original reference.
let vV60Service = card.shadowRoot.querySelectorAll(".vc-vehicle")[1];
const v60Toggle = findToggle(vV60Service, "service");
assert("V60 has a Service & health section (distance/time to service present)", !!v60Toggle);
assert("V60's collapsed summary shows 'All good' (no active warnings)", v60Toggle.innerHTML.includes("All good"));

// --- Engine action (fuel/PHEV only) ---
let vV60Engine = card.shadowRoot.querySelectorAll(".vc-vehicle")[1];
const engineBtn = vV60Engine.querySelector('[data-action="arm"][data-arm="engine"]');
assert("engine action button exists for V60 (has engine_start + engine_stop)", !!engineBtn);
assert("XC60 has NO engine action button (pure EV, no engine_start/stop entities)", !vXc60Service.querySelector('[data-action="arm"][data-arm="engine"]'));
engineBtn.dispatchEvent(new MouseEvent("click", { bubbles: true }));
vV60Engine = card.shadowRoot.querySelectorAll(".vc-vehicle")[1];
const engineChip = vV60Engine.querySelector('[data-action="confirm-engine"]');
assert("arming engine reveals a confirm chip", !!engineChip);
engineChip.dispatchEvent(new MouseEvent("click", { bubbles: true }));
const engineCall = serviceCalls.find((c) => c.domain === "button" && c.data.entity_id === "button.v60_engine_start");
assert("confirming engine (currently off) calls button.press on engine_start", !!engineCall && engineCall.service === "press");

// --- Daily distance bucketing (pure logic, called directly on the element) ---
const now = Date.now();
const day = 24 * 3600 * 1000;
const syntheticOdometerHistory = [
  { lu: Math.floor((now - 8 * day) / 1000), state: "1000" },
  { lu: Math.floor((now - 1 * day - 3600 * 1000) / 1000), state: "1120" },
  { lu: Math.floor((now - 3600 * 1000) / 1000), state: "1150" },
];
const distances = card._bucketizeDailyDistance(syntheticOdometerHistory);
assert("daily distance bucketing returns one entry per configured day", distances.length === 7);
assert("today's distance reflects the most recent delta (1150 - 1120 = 30)", distances[distances.length - 1] === 30);

// --- Lease budget: anniversary date math (pure logic) ---
const anniv1 = card._leaseAnniversaryStart("2020-06-15", new Date(2026, 8, 13)); // lease month/day already passed this year
assert("anniversary stays in the current year when the month/day already occurred", anniv1.getFullYear() === 2026 && anniv1.getMonth() === 5 && anniv1.getDate() === 15);

const anniv2 = card._leaseAnniversaryStart("2020-12-25", new Date(2026, 8, 13)); // lease month/day hasn't occurred yet this year
assert("anniversary rolls back to last year when the month/day hasn't happened yet this year", anniv2.getFullYear() === 2025 && anniv2.getMonth() === 11 && anniv2.getDate() === 25);

assert("an invalid lease_start_date returns null instead of throwing", card._leaseAnniversaryStart("not-a-date") === null);

// --- Lease budget: pace/projection math (pure logic, manual baseline, fixed synthetic "now") ---
const leaseNow = new Date(2026, 8, 13); // Sept 13 2026 — matches Jan 1 anniversary at ~255 days elapsed
const dXc60 = card._discoverVehicle("dev_xc60");

const underPaceVehicle = { device_id: "dev_xc60", lease_annual_limit_km: 20000, lease_start_date: "2026-01-01", lease_start_odometer_km: 10000 };
const underLease = card._computeLease(underPaceVehicle, dXc60, hass, leaseNow);
assert("lease computes 'ok' status when configured with a manual baseline and a live odometer reading", underLease.status === "ok");
assert("daysElapsed + daysLeft always equals daysInYear", underLease.daysElapsed + underLease.daysLeft === underLease.daysInYear);
assert("2026 is not a leap year, so the lease year is 365 days", underLease.daysInYear === 365);
assert("daysElapsed lands in the expected ~255-day window for a Jan 1 anniversary observed on Sept 13", underLease.daysElapsed > 250 && underLease.daysElapsed < 260);
assert("used = current odometer (18420) minus manual baseline (10000)", underLease.used === 8420);
assert("remaining = limit minus used (20000 - 8420)", Math.round(underLease.remaining) === 11580);
assert("driving far less than 8420km by day 255 of 365 is classified as under pace", underLease.paceStatus === "under" && underLease.overPaceKm < 0);
assert("projected year-end total at this (slow) rate stays under the annual limit", underLease.projectedTotal < underLease.limit);

const overPaceVehicle = { device_id: "dev_xc60", lease_annual_limit_km: 20000, lease_start_date: "2026-01-01", lease_start_odometer_km: 2000 };
const overLease = card._computeLease(overPaceVehicle, dXc60, hass, leaseNow);
assert("used = 18420 - 2000 = 16420", overLease.used === 16420);
assert("driving 16420km by day 255 of 365 (well above the ~14000km expected pace) is classified as over pace", overLease.paceStatus === "over" && overLease.overPaceKm > 0);
assert("16420 used is still under the 20000 annual limit, so overLimit is false", overLease.overLimit === false);

const overLimitVehicle = { device_id: "dev_xc60", lease_annual_limit_km: 15000, lease_start_date: "2026-01-01", lease_start_odometer_km: 2000 };
const overLimitLease = card._computeLease(overLimitVehicle, dXc60, hass, leaseNow);
assert("used (16420) exceeding a 15000 annual limit is classified as overLimit", overLimitLease.overLimit === true);
assert("remaining goes negative once the annual limit is actually exceeded", Math.round(overLimitLease.remaining) === -1420);

const noConfigLease = card._computeLease({ device_id: "dev_xc60" }, dXc60, hass, leaseNow);
assert("a vehicle with no lease config returns null (feature not enabled for that vehicle)", noConfigLease === null);

// --- Lease budget: rendered section (manual baseline, real "now" — end-to-end wiring) ---
const cardLease = document.createElement("volvo-cars-card");
stage.appendChild(cardLease);
cardLease.setConfig({
  vehicles: [
    { device_id: "dev_xc60", lease_annual_limit_km: 20000, lease_start_date: "2026-01-01", lease_start_odometer_km: 2000 },
    { device_id: "dev_v60" },
  ],
});
cardLease.hass = hass;
const vLeaseXc60 = cardLease.shadowRoot.querySelectorAll(".vc-vehicle")[0];
const vLeaseV60 = cardLease.shadowRoot.querySelectorAll(".vc-vehicle")[1];
const leaseToggle = Array.from(vLeaseXc60.querySelectorAll('[data-action="toggle-section"]')).find((el) => el.dataset.section === "lease");
assert("XC60 (configured with lease fields) shows a Lease budget section", !!leaseToggle);
assert("V60 (no lease config) shows NO Lease budget section", !Array.from(vLeaseV60.querySelectorAll('[data-action="toggle-section"]')).some((el) => el.dataset.section === "lease"));
assert("collapsed summary shows an over-pace warning for this scenario (16420 used, low baseline)", leaseToggle.innerHTML.includes("over pace"));
assert("chart/detail is not shown while collapsed", !vLeaseXc60.innerHTML.includes("km left this year"));
leaseToggle.dispatchEvent(new MouseEvent("click", { bubbles: true }));
const vLeaseXc60Expanded = cardLease.shadowRoot.querySelectorAll(".vc-vehicle")[0];
assert("expanding reveals the 'km left this year' stat", vLeaseXc60Expanded.innerHTML.includes("km left this year"));
assert("expanding reveals the annual usage chart with the configured target", vLeaseXc60Expanded.innerHTML.includes("Target 20000 km"));
assert("expanding reveals the manual baseline note", vLeaseXc60Expanded.innerHTML.includes("manually entered"));
assert("expanding reveals a 'Last 7 days' heading inside the lease section (regression: this was only in the design mockup, missing from the first real implementation)", vLeaseXc60Expanded.innerHTML.includes("Last 7 days"));

// Seed synthetic daily-distance data directly (bypassing the async history
// fetch, which the shared mock always resolves empty) to test the lease
// section's own daily bars — distinct from the general Distance driven
// chart because it colors bars against the LEASE's daily budget (20000/365
// ≈ 54.8 km/day here), not just a generic min/max trend.
cardLease._odoHistory.set("dev_xc60", { distances: [30, 60, 40, 80, 20, 70, 50], fetchedAt: Date.now(), fetching: false });
cardLease._render();
const vLeaseXc60WithBars = cardLease.shadowRoot.querySelectorAll(".vc-vehicle")[0];
assert("lease section's daily chart shows the daily budget reference label (20000/365 ≈ 54.8 km/day)", vLeaseXc60WithBars.innerHTML.includes("54.8 km/day"));

// Scope to just the lease section's own wrapper — the vehicle also has a
// door diagram elsewhere with its own unrelated <rect> elements.
const leaseSectionEl = vLeaseXc60WithBars.querySelector('[data-action="toggle-section"][data-section="lease"]').closest(".vc-section");
const leaseRects = leaseSectionEl.querySelectorAll("svg rect");
assert("seeded daily distances render as SVG bars (7 days of data)", leaseRects.length === 7);
const barColors = Array.from(leaseRects).map((r) => r.getAttribute("fill"));
assert("bars over the daily budget (60,80,70) are colored with the warning token", barColors.filter((c) => c === "var(--warning-color)").length === 3);
assert("bars under the daily budget (30,40,20,50) are colored with the success token", barColors.filter((c) => c === "var(--success-color)").length === 4);

// --- Lease budget: auto-detected baseline via mocked recorder statistics ---
const wsCalls = [];
const hassWithWs = {
  ...hass,
  callWS: (msg) => {
    wsCalls.push(msg);
    return Promise.resolve({
      "sensor.xc60_odometer": [
        { start: Date.parse("2026-01-01T00:00:00"), state: 5000 },
        { start: Date.parse("2026-03-01T00:00:00"), state: 8000 },
      ],
    });
  },
};
const cardAutoLease = document.createElement("volvo-cars-card");
stage.appendChild(cardAutoLease);
cardAutoLease.setConfig({
  vehicles: [{ device_id: "dev_xc60", lease_annual_limit_km: 20000, lease_start_date: "2026-01-01" }],
});
cardAutoLease.hass = hassWithWs;
await new Promise((resolve) => setTimeout(resolve, 0));
assert("configuring lease fields without a manual baseline triggers a recorder/statistics_during_period call", wsCalls.some((m) => m.type === "recorder/statistics_during_period" && m.statistic_ids[0] === "sensor.xc60_odometer"));
const vAutoXc60 = cardAutoLease.shadowRoot.querySelectorAll(".vc-vehicle")[0];
const autoLeaseToggle = Array.from(vAutoXc60.querySelectorAll('[data-action="toggle-section"]')).find((el) => el.dataset.section === "lease");
autoLeaseToggle.dispatchEvent(new MouseEvent("click", { bubbles: true }));
const vAutoXc60Expanded = cardAutoLease.shadowRoot.querySelectorAll(".vc-vehicle")[0];
assert("with no manual baseline, the auto-detected note is shown instead", vAutoXc60Expanded.innerHTML.includes("auto-detected"));

// --- Title option test (regression: the header used to be a hardcoded,
// untranslatable-by-config "Volvo Cars" with no way to customize or hide it) ---
assert("default config shows the translated default title", card.shadowRoot.querySelector(".vc-title")?.textContent === "Volvo Cars");

const cardCustomTitle = document.createElement("volvo-cars-card");
stage.appendChild(cardCustomTitle);
cardCustomTitle.setConfig({ vehicles: [{ device_id: "dev_xc60" }], title: "Our Cars" });
cardCustomTitle.hass = hass;
assert("a configured title overrides the default", cardCustomTitle.shadowRoot.querySelector(".vc-title")?.textContent === "Our Cars");

const cardNoTitle = document.createElement("volvo-cars-card");
stage.appendChild(cardNoTitle);
cardNoTitle.setConfig({ vehicles: [{ device_id: "dev_xc60" }], title: "" });
cardNoTitle.hass = hass;
assert("an explicitly empty title hides the header row entirely", !cardNoTitle.shadowRoot.querySelector(".vc-header"));

// --- Layout option test ---
const gridEl = card.shadowRoot.querySelector(".vc-grid");
assert("default layout ('auto') uses a responsive auto-fit grid", gridEl.style.gridTemplateColumns.includes("auto-fit"));

const cardHorizontal = document.createElement("volvo-cars-card");
stage.appendChild(cardHorizontal);
cardHorizontal.setConfig({
  vehicles: [{ device_id: "dev_xc60" }, { device_id: "dev_v60" }],
  layout: "horizontal",
});
cardHorizontal.hass = hass;
const gridH = cardHorizontal.shadowRoot.querySelector(".vc-grid");
assert("layout: horizontal forces one column per vehicle, ignoring container width", gridH.style.gridTemplateColumns.startsWith("repeat(2,"));

const cardVertical = document.createElement("volvo-cars-card");
stage.appendChild(cardVertical);
cardVertical.setConfig({
  vehicles: [{ device_id: "dev_xc60" }, { device_id: "dev_v60" }],
  layout: "vertical",
});
cardVertical.hass = hass;
const gridV = cardVertical.shadowRoot.querySelector(".vc-grid");
assert("layout: vertical forces a single stacked column", gridV.style.gridTemplateColumns === "1fr");

// --- Lock button test: every action now needs an extra confirm tap ---
// Each click re-renders the whole card, so re-query the DOM after every
// click instead of reusing a stale element reference.
let vXc60 = card.shadowRoot.querySelectorAll(".vc-vehicle")[0];
const lockBtn = vXc60.querySelector('[data-action="arm"][data-arm="lock"]');
assert("lock button exists for XC60", !!lockBtn);
lockBtn.dispatchEvent(new MouseEvent("click", { bubbles: true }));
assert("tapping the lock icon does NOT call any service yet — it only arms a confirm step", !serviceCalls.some((c) => c.domain === "lock"));
vXc60 = card.shadowRoot.querySelectorAll(".vc-vehicle")[0];
const confirmLockChip = vXc60.querySelector('[data-action="confirm-lock"]');
assert("arming the lock action reveals a confirm chip", !!confirmLockChip);
confirmLockChip.dispatchEvent(new MouseEvent("click", { bubbles: true }));
const lockCall = serviceCalls.find((c) => c.domain === "lock");
assert("tapping the confirm chip (currently locked) calls lock.unlock", lockCall && lockCall.service === "unlock" && lockCall.data.entity_id === "lock.xc60_lock");

// Tapping the same icon a second time (without confirming) collapses it again
let vV60 = card.shadowRoot.querySelectorAll(".vc-vehicle")[1];
const v60LockBtn = vV60.querySelector('[data-action="arm"][data-arm="lock"]');
v60LockBtn.dispatchEvent(new MouseEvent("click", { bubbles: true }));
vV60 = card.shadowRoot.querySelectorAll(".vc-vehicle")[1];
assert("arming V60's lock reveals its own confirm chip", !!vV60.querySelector('[data-action="confirm-lock"]'));
vV60.querySelector('[data-action="arm"][data-arm="lock"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));
vV60 = card.shadowRoot.querySelectorAll(".vc-vehicle")[1];
assert("tapping the same icon again dismisses the confirm chip without calling any service", !vV60.querySelector('[data-action="confirm-lock"]') && !serviceCalls.some((c) => c.data && c.data.entity_id === "lock.v60_lock"));

// --- Honk button test: arming reveals Horn / Lights / Horn & lights choices ---
vXc60 = card.shadowRoot.querySelectorAll(".vc-vehicle")[0];
const honkBtn = vXc60.querySelector('[data-action="arm"][data-arm="honk"]');
assert("honk button exists for XC60", !!honkBtn);
honkBtn.dispatchEvent(new MouseEvent("click", { bubbles: true }));
vXc60 = card.shadowRoot.querySelectorAll(".vc-vehicle")[0];
const hornChip = vXc60.querySelector('[data-action="honk-horn"]');
const lightsChip = vXc60.querySelector('[data-action="honk-lights"]');
const bothChip = vXc60.querySelector('[data-action="honk-both"]');
assert("arming honk reveals all three choices: horn, lights, horn & lights", !!hornChip && !!lightsChip && !!bothChip);
bothChip.dispatchEvent(new MouseEvent("click", { bubbles: true }));
const honkCall = serviceCalls.find((c) => c.domain === "button" && c.data.entity_id === "button.xc60_honk_flash");
assert("choosing 'Horn & lights' calls button.press on the honk_flash entity", !!honkCall && honkCall.service === "press");

// --- Editor test ---------------------------------------------------
const editor = document.createElement("volvo-cars-card-editor");
stage.appendChild(editor);
let lastConfig = null;
editor.addEventListener("config-changed", (e) => { lastConfig = e.detail.config; });
editor.setConfig({ type: "custom:volvo-cars-card", vehicles: [], show_stats: true, stats_history_hours: 168 });
editor.hass = hass;

assert("editor starts with zero vehicle blocks", editor.shadowRoot.querySelectorAll(".ed-vehicle-block").length === 0);

const addBtn = editor.shadowRoot.querySelector('[data-action="add-vehicle"]');
assert("add-vehicle button exists", !!addBtn);
addBtn.dispatchEvent(new MouseEvent("click", { bubbles: true }));

assert("clicking 'add vehicle' fires config-changed (regression: this used to silently no-op)", lastConfig !== null && lastConfig.vehicles.length === 1);
assert("editor now shows one vehicle block", editor.shadowRoot.querySelectorAll(".ed-vehicle-block").length === 1);
assert("config-changed preserves 'type' (regression: setConfig used to drop it, breaking the edit dialog with 'No card type configured')", lastConfig.type === "custom:volvo-cars-card");

const select = editor.shadowRoot.querySelector(".ed-select");
assert("device dropdown exists in the row", !!select);
const optionLabels = Array.from(select.options).map((o) => o.textContent);
assert("dropdown lists Volvo devices (XC60, V60)", optionLabels.includes("XC60") && optionLabels.includes("V60"));
assert("dropdown excludes non-Volvo devices", !optionLabels.includes("Some Router"));

// A live HA instance reassigns `hass` continuously as any entity's state
// changes anywhere — the editor must not tear down its DOM (closing an
// open dropdown, losing input focus) unless something it actually shows
// (devices, language) changed.
const selectBefore = editor.shadowRoot.querySelector(".ed-select");
editor.hass = { ...hass }; // same devices/language, new top-level reference — simulates a routine hass tick
const selectAfter = editor.shadowRoot.querySelector(".ed-select");
assert("a routine hass update (unchanged devices/language) does not re-render the editor (regression: this used to close any open dropdown mid-selection)", selectBefore === selectAfter);

const showStatsCheckbox = editor.shadowRoot.querySelector('[data-field="show_stats"]');
assert("show_stats checkbox exists", !!showStatsCheckbox);
showStatsCheckbox.checked = false;
showStatsCheckbox.dispatchEvent(new Event("change", { bubbles: true }));
assert("toggling show_stats fires config-changed with the new value (regression: used to require data-idx and silently no-op)", lastConfig.show_stats === false);
assert("'type' still survives after further edits", lastConfig.type === "custom:volvo-cars-card");

const layoutSelect = editor.shadowRoot.querySelector('[data-field="layout"]');
assert("layout select exists", !!layoutSelect);
layoutSelect.value = "horizontal";
layoutSelect.dispatchEvent(new Event("change", { bubbles: true }));
assert("changing layout fires config-changed with the new value", lastConfig.layout === "horizontal");

const titleInput = editor.shadowRoot.querySelector('[data-field="title"]');
assert("title input exists in the editor", !!titleInput);
titleInput.value = "Our Cars";
titleInput.dispatchEvent(new Event("change", { bubbles: true }));
assert("changing the title input fires config-changed with the new value", lastConfig.title === "Our Cars");

// --- Render summary ------------------------------------------------
const list = document.getElementById("results");
results.forEach((r) => {
  const li = document.createElement("li");
  li.className = r.pass ? "pass" : "fail";
  li.textContent = (r.pass ? "PASS — " : "FAIL — ") + r.desc;
  list.appendChild(li);
});
const failCount = results.filter((r) => !r.pass).length;
const summary = document.getElementById("summary");
summary.textContent = failCount === 0
  ? `All ${results.length} checks passed`
  : `${failCount} of ${results.length} checks FAILED`;
summary.style.background = failCount === 0 ? "#1b3a1f" : "#3a1b1b";
summary.style.color = failCount === 0 ? "#4caf50" : "#ef5350";
})();
</script>
</body>
</html>
